<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>stoa</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script defer src="/static/app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="dashboard()" x-init="boot()">
  <header>
    <div class="brand">stoa</div>
    <div class="status">
      vault: <span x-text="vaultBaseName"></span>
      &middot; wikis: <span x-text="wikis.length"></span>
      &middot; active tasks: <span x-text="activeTaskCount"></span>
      &middot; <span x-text="lastRefreshDelta"></span>
      <span class="live-dot" :class="{ paused: pollPaused }"></span>
    </div>
    <div class="pinned-views">
      <template x-for="pin in pinnedViews" :key="pin.name">
        <button class="pin-chip" @click="applyPin(pin)" x-text="pin.name"></button>
      </template>
      <button class="pin-add" @click="addPin()">&#xFF0B; pin</button>
    </div>
    <button @click="stalenessOpen = !stalenessOpen" x-show="syntheses.length > 0" class="staleness-toggle" :class="{ active: stalenessOpen }">syntheses <span x-text="syntheses.length"></span></button>
    <button @click="refresh()" :disabled="loading">refresh</button>
  </header>
  <section class="watchdog" x-show="stuckTasks.length > 0">
    <div class="watchdog-title" x-text="`${stuckTasks.length} stuck task${stuckTasks.length === 1 ? '' : 's'}`"></div>
    <ul>
      <template x-for="t in stuckTasks" :key="t.id">
        <li class="stuck-row">
          <a :href="taskHref(t)" x-text="t.title" class="stuck-title"></a>
          <span class="stuck-claimer" x-text="t.claimed_by"></span>
          <span class="stuck-idle" x-text="t._stuckMinutes + 'm idle'"></span>
          <button @click="releaseStuckTask(t)" :disabled="t._releaseLoading">release</button>
          <button @click="pingChannel(t)" :disabled="!t.channel || t._pingLoading">ping</button>
        </li>
      </template>
    </ul>
  </section>
  <section class="pane staleness staleness-drawer" x-show="stalenessOpen && syntheses.length > 0">
    <div class="pane-header">
      <h2>Stale syntheses</h2>
      <span class="staleness-count" x-text="syntheses.length"></span>
    </div>
    <ul>
      <template x-for="s in syntheses" :key="s.id">
        <li class="staleness-row" :class="freshnessClass(s)">
          <span class="freshness-badge" :title="freshnessLabel(s)"></span>
          <a :href="synthesisHref(s)" x-text="s.title" class="staleness-title"></a>
          <span class="staleness-wiki" x-text="s.wiki"></span>
          <span class="staleness-lag" x-text="s.lag_days === null ? 'never' : s.lag_days + 'd'"></span>
          <span class="staleness-stale-count" x-text="`${s.stale_inputs.length} moved`" x-show="s.stale_inputs.length > 0"></span>
        </li>
      </template>
    </ul>
  </section>
  <main class="grid">
    <section class="pane agents">
      <h2>Agents</h2>
      <ul x-show="agents.length > 0">
        <template x-for="a in agents" :key="a.id">
          <li class="agent-card" :class="['rarity-' + (a.rarity || 'common'), { 'is-shiny': a.is_shiny }]">
            <img :src="a.spriteUrl" :alt="a.pokemon" class="sprite" />
            <div class="agent-info">
              <span class="agent-name" x-text="a.pokemon"></span>
              <span class="agent-type" x-text="a.pokemon_type"></span>
              <span class="agent-stage" x-text="a.evolution_stage"></span>
              <span class="agent-tasks" x-text="a.claimedTaskCount + ' task(s)'"></span>
            </div>
            <span class="shiny-marker" x-show="a.is_shiny">✨</span>
            <div class="agent-row-actions"></div>
          </li>
        </template>
      </ul>
      <p x-show="agents.length === 0" class="empty-state">No agents registered.</p>
      <div id="agents-actions">
        <button @click="openSpawn()" class="spawn-trigger">+ new agent</button>
      </div>
    </section>
    <section class="pane tasks">
      <div class="pane-header">
        <h2>Tasks</h2>
        <select x-model="taskStatusFilter" class="filter-select">
          <option value="active">active</option>
          <option value="all">all</option>
          <option value="pending">pending</option>
          <option value="claimed">claimed</option>
          <option value="in_progress">in_progress</option>
          <option value="completed">completed</option>
          <option value="failed">failed</option>
          <option value="blocked">blocked</option>
        </select>
      </div>
      <ul x-show="filteredTasks.length > 0">
        <template x-for="t in filteredTasks" :key="t.id">
          <li class="task-row">
            <a :href="taskHref(t)" x-text="t.title" class="task-title"></a>
            <span class="task-wiki" x-text="t.wiki"></span>
            <span class="task-status" :class="'status-' + t.status" x-text="t.status"></span>
            <span class="task-claimer" x-show="t.claimed_by" x-text="t.claimed_by"></span>
            <span class="task-channel" x-show="t.channel" x-text="t.channel"></span>
            <span class="task-type" x-show="t.required_pokemon_type" x-text="t.required_pokemon_type"></span>
            <span class="task-updated" x-text="relTime(t.updated)"></span>
            <div class="task-row-actions"></div>
          </li>
        </template>
      </ul>
      <p x-show="filteredTasks.length === 0" class="empty-state">No tasks found.</p>
    </section>
    <section class="pane channels">
      <h2>Channels</h2>
      <ul x-show="channelEntries.length > 0">
        <template x-for="e in channelEntries" :key="e.id">
          <li class="channel-row">
            <span class="channel-name" x-text="e.channel"></span>
            <span class="channel-author" x-text="e.author"></span>
            <span class="channel-ts" x-text="relTime(e.ts)"></span>
            <span class="channel-excerpt" x-text="e.excerpt"></span>
            <span class="channel-wiki" x-text="e.wiki"></span>
            <a :href="channelHref(e)" class="channel-link">open</a>
            <div class="channel-row-actions"></div>
          </li>
        </template>
      </ul>
      <p x-show="channelEntries.length === 0" class="empty-state">No channel entries yet.</p>
      <div id="channels-actions"></div>
    </section>
  </main>

<div class="spawn-modal-backdrop" x-show="spawnOpen" @click.self="closeSpawn()">
  <div class="spawn-modal">
    <div class="spawn-modal-header">
      <h3>Spawn agent</h3>
      <button class="spawn-close" @click="closeSpawn()" aria-label="close">×</button>
    </div>

    <div class="spawn-modal-body">
      <label>
        <span>Specialty</span>
        <input type="text" x-model="spawnSpecialty" placeholder="e.g. frontend, backend, qa"
               @keydown.enter="suggest()" :disabled="spawnLoading">
      </label>

      <button class="spawn-suggest" @click="suggest()" :disabled="!spawnSpecialty || spawnLoading">
        <span x-show="!spawnLoading">Suggest</span>
        <span x-show="spawnLoading">Loading…</span>
      </button>

      <div class="spawn-grid" x-show="spawnSuggestions.length > 0">
        <template x-for="s in spawnSuggestions" :key="s.name">
          <button class="spawn-candidate"
                  :class="['rarity-' + s.rarity, { selected: spawnSelected && spawnSelected.name === s.name }]"
                  @click="spawnSelected = s">
            <img :src="s.spriteUrl" :alt="s.name" width="48" height="48" class="sprite">
            <span class="candidate-name" x-text="s.name"></span>
            <span class="candidate-type" x-text="s.pokemon_type"></span>
            <span class="rarity-badge" x-text="s.rarity" x-show="s.rarity !== 'common'"></span>
          </button>
        </template>
      </div>

      <p class="spawn-hint" x-show="spawnSuggestions.length === 0 && !spawnLoading">
        Enter a specialty and click Suggest to see candidate Pokemon.
      </p>
    </div>

    <div class="spawn-modal-footer">
      <button @click="closeSpawn()">Cancel</button>
      <button class="spawn-register" @click="register()" :disabled="!spawnSelected || spawnLoading">
        <span x-show="!spawnLoading">Register</span>
        <span x-show="spawnLoading">Registering…</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
